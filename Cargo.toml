[package]
name = "saddle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A reverse agent harness: a coding agent TUI that cannot write to your codebase"
publish = false

[dependencies]
anyhow = "1"
async-lsp = { version = "0.2.4", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
genai = "=0.7.1"
globset = "0.4.20"
ignore = "0.4.33"
notify = "8.2"
notify-debouncer-full = "0.7"
lsp-types = "0.95.1"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
similar = "3"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width", "smawk"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54", features = ["net", "io-util"] }
